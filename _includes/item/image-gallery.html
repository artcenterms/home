{% comment %}

    For image items, render the artwork directly without lightbox or download behavior.

{%- endcomment -%}
<img
    id="{{ page.objectid }}"
    src="{{ page.image_small | default: page.object_location | relative_url }}"
    alt="{{ page.image_alt_text | default: page.description | default: page.title | escape }}"
    class="img-fluid"
>
