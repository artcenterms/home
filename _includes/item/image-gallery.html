{% comment %}
    For image items, render the image directly without lightbox or download behavior.
{%- endcomment -%}
<img
    id="{{ page.objectid }}"
    src="{{ page.object_location | relative_url }}"
    alt="{{ page.image_alt_text | default: page.description | default: page.title | escape }}"
    class="img-fluid item-page__image"
>
